name: Build Outlaw Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: brew install ldid

    - name: Set up Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Download iOS SDK
      run: |
        SDK_RELEASE_TAG=master-146e41f
        SDK_ARCHIVE=iPhoneOS14.5.sdk.tar.xz
        curl --fail --location --retry 3 --output "$SDK_ARCHIVE" \
          "https://github.com/theos/sdks/releases/download/${SDK_RELEASE_TAG}/${SDK_ARCHIVE}"
        tar -tJf "$SDK_ARCHIVE" >/dev/null
        mkdir -p $HOME/theos/sdks
        tar -xJf "$SDK_ARCHIVE" -C $HOME/theos/sdks
        rm "$SDK_ARCHIVE"

    - name: Build Tweak (.dylib)
      run: |
        make clean
        make FINALPACKAGE=1

    - name: Upload Outlaw Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Outlaw-Dylib
        path: .theos/obj/**/Outlaw.dylib
